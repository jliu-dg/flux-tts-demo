<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flux Voice Demo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
    }
    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 860px;
      margin: 0 auto;
      border-left: 1px solid #1a1a1a;
      border-right: 1px solid #1a1a1a;
      background: #0b0b0b;
    }
    .header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #1a1a1a;
    }
    .title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }
    .title span { color: #13ef95; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #a5a5a5;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
    }
    .dot.on { background: #13ef95; box-shadow: 0 0 10px rgba(19, 239, 149, 0.45); }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .welcome {
      margin: auto;
      text-align: center;
      color: #8a8a8a;
      line-height: 1.6;
      font-size: 13px;
    }
    .welcome strong { color: #13ef95; font-weight: 600; }

    .msg {
      max-width: 86%;
      padding: 10px 12px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.45;
      border: 1px solid #1f1f1f;
      word-break: break-word;
    }
    .msg.user {
      margin-left: auto;
      background: #151515;
      border-color: #2a2a2a;
    }
    .msg.assistant {
      margin-right: auto;
      background: rgba(19, 239, 149, 0.07);
      border-color: rgba(19, 239, 149, 0.35);
    }
    .msg-label {
      font-size: 10px;
      color: #7d7d7d;
      margin-bottom: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .footer {
      border-top: 1px solid #1a1a1a;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .select {
      border: 1px solid #2b2b2b;
      background: #121212;
      color: #e8e8e8;
      font-size: 12px;
      border-radius: 999px;
      padding: 9px 12px;
      min-width: 170px;
    }
    .btn {
      border: 1px solid #2b2b2b;
      background: #121212;
      color: #f1f1f1;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
    }
    .btn.primary {
      border-color: rgba(19, 239, 149, 0.5);
      color: #13ef95;
      background: rgba(19, 239, 149, 0.08);
    }
    .hint {
      font-size: 11px;
      color: #7e7e7e;
    }
    .error {
      color: #ff7a7a;
      font-size: 11px;
      max-width: 52%;
      text-align: right;
    }
    .debug-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 350px;
      height: 100vh;
      background: #090909;
      border-left: 1px solid #1f1f1f;
      transform: translateX(100%);
      transition: transform 0.18s ease;
      display: flex;
      flex-direction: column;
      z-index: 50;
    }
    .debug-panel.open { transform: translateX(0); }
    .debug-header {
      height: 52px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 12px;
      color: #cfcfcf;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .debug-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 11px;
    }
    .debug-item {
      border: 1px solid #242424;
      border-radius: 8px;
      padding: 8px;
      background: #111;
      color: #d8d8d8;
      line-height: 1.4;
    }
    .debug-item .t { color: #13ef95; font-weight: 600; margin-right: 8px; }
    .debug-item .k { color: #9d9d9d; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="title">VAPI <span>SUPPORT</span></div>
      <div class="status">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">offline</span>
      </div>
    </header>

    <main class="messages" id="messages">
      <div class="welcome" id="welcome">
        Tap <strong>Turn On</strong> and start speaking.<br>
        Assistant and user turns appear here.
      </div>
    </main>

    <footer class="footer">
      <div class="controls">
        <button class="btn primary" id="startBtn" onclick="startSession()">Turn On</button>
        <button class="btn" id="stopBtn" onclick="stopSession()" style="display:none">Stop</button>
        <button class="btn" id="expressiveBtn" onclick="toggleExpressive()">Expressive: Off</button>
        <button class="btn" id="progressiveBtn" onclick="toggleProgressive()">Progressive TTS: Off</button>
        <button class="btn" id="debugBtn" onclick="toggleDebug()">Debug: Off</button>
      </div>
      <div class="hint">Sandbox voice only</div>
      <div class="error" id="errorText"></div>
    </footer>
  </div>
  <aside class="debug-panel" id="debugPanel">
    <div class="debug-header">
      <span>Latency Debug</span>
      <button class="btn" style="padding:6px 10px;font-size:11px" onclick="clearDebug()">Clear</button>
    </div>
    <div class="debug-list" id="debugList"></div>
  </aside>

  <script>
    const socket = io();
    let audioCtx = null;
    let micStream = null;
    let scriptProcessor = null;
    let nextPlayTime = 0;
    let isRunning = false;
    let activeSources = [];
    let debugEnabled = false;
    let flowMode = 'vapi_support';
    let pendingAssistantMessages = [];
    let progressiveTtsEnabled = false;
    let expressiveModeEnabled = false;

    function nowTs() {
      return new Date().toLocaleTimeString();
    }
    function logDebug(stage, details) {
      const list = document.getElementById('debugList');
      const row = document.createElement('div');
      row.className = 'debug-item';
      const detailText = details ? Object.entries(details).map(([k, v]) => `${k}: ${v}`).join(' | ') : '';
      row.innerHTML = `<span class="t">${nowTs()}</span><span class="k">${stage}</span><div>${detailText}</div>`;
      list.prepend(row);
      while (list.children.length > 200) list.removeChild(list.lastChild);
    }
    function toggleDebug() {
      debugEnabled = !debugEnabled;
      document.getElementById('debugPanel').classList.toggle('open', debugEnabled);
      document.getElementById('debugBtn').textContent = debugEnabled ? 'Debug: On' : 'Debug: Off';
    }
    function clearDebug() {
      document.getElementById('debugList').innerHTML = '';
    }
    function updateExpressiveBtn() {
      document.getElementById('expressiveBtn').textContent = expressiveModeEnabled ? 'Expressive: On' : 'Expressive: Off';
    }
    function toggleExpressive() {
      expressiveModeEnabled = !expressiveModeEnabled;
      updateExpressiveBtn();
      logDebug('ui_expressive_toggle', { enabled: expressiveModeEnabled });
    }
    function updateProgressiveBtn() {
      document.getElementById('progressiveBtn').textContent = progressiveTtsEnabled ? 'Progressive TTS: On' : 'Progressive TTS: Off';
    }
    function toggleProgressive() {
      progressiveTtsEnabled = !progressiveTtsEnabled;
      updateProgressiveBtn();
      logDebug('ui_progressive_tts_toggle', { enabled: progressiveTtsEnabled });
    }

    function setStatus(on) {
      document.getElementById('statusDot').classList.toggle('on', !!on);
      document.getElementById('statusText').textContent = on ? 'live' : 'offline';
    }
    function setStatusText(text, on=true) {
      document.getElementById('statusDot').classList.toggle('on', !!on);
      document.getElementById('statusText').textContent = text;
    }

    function setError(msg) {
      document.getElementById('errorText').textContent = msg || '';
    }

    function renderMessage(role, content) {
      const wrap = document.getElementById('messages');
      const row = document.createElement('div');
      row.className = `msg ${role}`;
      row.innerHTML = `
        <div class="msg-label">${role === 'user' ? 'You' : 'Assistant'}</div>
        <div>${content || ''}</div>
      `;
      wrap.appendChild(row);
      wrap.scrollTop = wrap.scrollHeight;
    }

    function flushPendingAssistantMessage() {
      if (!pendingAssistantMessages.length) return;
      const content = pendingAssistantMessages.shift();
      renderMessage('assistant', content);
    }

    function formatAssistantTextForDisplay(content) {
      const text = content || '';
      if (!expressiveModeEnabled) return text;
      let cleaned = text;
      cleaned = cleaned.replace(/\b(um+|uh+|erm+|hmm+)\b[, ]*/gi, '');
      cleaned = cleaned.replace(/\b(you know|i mean)\b[, ]*/gi, '');
      cleaned = cleaned.replace(/\s{2,}/g, ' ').trim();
      return cleaned || text;
    }

    function resampleToInt16_16k(float32, inputRate) {
      const ratio = inputRate / 16000;
      const outLen = Math.round(float32.length / ratio);
      const out = new Int16Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const srcIdx = i * ratio;
        const lo = Math.floor(srcIdx);
        const hi = Math.min(lo + 1, float32.length - 1);
        const frac = srcIdx - lo;
        const val = float32[lo] + frac * (float32[hi] - float32[lo]);
        out[i] = Math.max(-32768, Math.min(32767, Math.round(val * 32767)));
      }
      return out;
    }

    async function loadUiConfig() {
      try {
        const res = await fetch('/api/ui-config');
        if (!res.ok) return;
        const cfg = await res.json();
        flowMode = cfg.flowMode || 'vapi_support';
        progressiveTtsEnabled = !!cfg.progressiveTtsDefault;
        expressiveModeEnabled = !!cfg.expressiveDefault;
        updateProgressiveBtn();
        updateExpressiveBtn();
      } catch (e) {
        logDebug('ui_config_error', { error: String(e) });
      }
    }

    async function startSession() {
      logDebug('ui_start_clicked');
      setError('');
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = '';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1, sampleRate: { ideal: 16000 } }
        });
        micStream = stream;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        scriptProcessor = audioCtx.createScriptProcessor(1024, 1, 1);
        scriptProcessor.onaudioprocess = (e) => {
          if (!isRunning) return;
          const int16 = resampleToInt16_16k(e.inputBuffer.getChannelData(0), audioCtx.sampleRate);
          socket.emit('audio_data', { audio: int16.buffer, sampleRate: 16000 });
        };
        source.connect(scriptProcessor);
        scriptProcessor.connect(audioCtx.destination);
        socket.emit('start_voice_agent', {
          browserAudio: true,
          progressiveTts: progressiveTtsEnabled,
          expressiveMode: expressiveModeEnabled,
        });
        isRunning = true;
        setStatusText('connecting', true);
        logDebug('ui_session_started', {
          progressive_tts: progressiveTtsEnabled,
          expressive_mode: expressiveModeEnabled,
        });
      } catch (err) {
        logDebug('ui_mic_error', { error: String(err) });
        setError('Microphone access required');
        stopSession();
      }
    }

    function stopSession() {
      logDebug('ui_stop');
      isRunning = false;
      socket.emit('stop_voice_agent');
      if (scriptProcessor) { scriptProcessor.disconnect(); scriptProcessor = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
      activeSources.forEach(s => { try { s.stop(); } catch (e) {} });
      activeSources = [];
      nextPlayTime = 0;
      pendingAssistantMessages = [];
      document.getElementById('startBtn').style.display = '';
      document.getElementById('stopBtn').style.display = 'none';
      setStatus(false);
    }

    socket.on('conversation_update', (msg) => {
      logDebug('conversation_update', { role: msg.role, chars: (msg.content || '').length });
      if (msg.role === 'assistant') {
        pendingAssistantMessages.push(formatAssistantTextForDisplay(msg.content || ''));
      } else {
        renderMessage('user', msg.content || '');
        setStatusText('listening', true);
      }
    });

    socket.on('audio_output', (data) => {
      if (!audioCtx || !isRunning) return;
      if (!data.audio_b64) return;
      flushPendingAssistantMessage();
      setStatusText('assistant speaking', true);
      const raw = atob(data.audio_b64);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      const int16 = new Int16Array(bytes.buffer);
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;
      const sampleRate = data.sampleRate || 24000;
      const buffer = audioCtx.createBuffer(1, float32.length, sampleRate);
      buffer.getChannelData(0).set(float32);
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      if (nextPlayTime < now) nextPlayTime = now;
      src.start(nextPlayTime);
      nextPlayTime += buffer.duration;
      activeSources.push(src);
      src.onended = () => { activeSources = activeSources.filter(s => s !== src); };
      logDebug('audio_output', { sample_rate: sampleRate, samples: int16.length });
    });

    socket.on('stop_audio_output', () => {
      activeSources.forEach(s => { try { s.stop(); } catch (e) {} });
      activeSources = [];
      nextPlayTime = 0;
    });

    socket.on('agent_error', (data) => {
      logDebug('agent_error', { message: (data && data.message) ? data.message : 'Voice agent error' });
      setError((data && data.message) ? data.message : 'Voice agent error');
      stopSession();
    });
    socket.on('latency_event', (evt) => {
      logDebug(evt.stage || 'latency_event', evt.details || {});
    });
    socket.on('vapi_flow_event', (evt) => {
      logDebug(`vapi:${evt.phase || 'event'}`, evt.details || {});
      const phase = evt.phase || '';
      if (phase === 'provider_connected') setStatusText('connected', true);
      if (phase === 'settings_applied') setStatusText('listening', true);
      if (phase === 'assistant_generating') setStatusText('assistant thinking', true);
      if (phase === 'assistant_done') {
        // Fallback: if audio didn't arrive for any reason, still show text.
        while (pendingAssistantMessages.length) flushPendingAssistantMessage();
        setStatusText('listening', true);
      }
      if (phase === 'session_stop') setStatus(false);
    });
    loadUiConfig();
  </script>
</body>
</html>
