<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ring {
      fill: none;
      stroke: #00d4ff;
      stroke-width: 0.5;
      stroke-dasharray: 20 10;
      transform-origin: center;
    }
    .inner-core {
      fill: #00d4ff;
      opacity: 0.6;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes rotate-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes rotate-ccw { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(0.9); opacity: 0.3; } 50% { transform: scale(1.1); opacity: 0.7; } }
  </style>
  
  <circle class="ring" cx="50" cy="50" r="45" style="animation: rotate-cw 20s linear infinite;" />
  
  <circle class="ring" cx="50" cy="50" r="35" style="animation: rotate-ccw 15s linear infinite; stroke-opacity: 0.6;" />
  
  <circle class="inner-core" cx="50" cy="50" r="5" />
  
  <circle fill="#fff" cx="50" cy="5" r="0.8">
    <animateMotion dur="5s" repeatCount="indefinite" path="M 0,0 A 45,45 0 1 1 0,90 A 45,45 0 1 1 0,0" />
  </circle>
</svg>
